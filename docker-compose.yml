services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: safeops-postgres
    environment:
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops_security
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - safeops
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeops -d safeops_security"]
      interval: 5s
      timeout: 5s
      retries: 20

  # =========================
  # MongoDB
  # =========================
  mongo:
    image: mongo:6
    container_name: safeops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - safeops
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # =========================
  # Log Collector
  # =========================
  log-collector:
    build:
      context: ./services/log-collector
    container_name: log-collector
    env_file:
      - ./.env
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JSON_LIMIT: 2mb
      RATE_LIMIT_PER_MIN: 60
      INGEST_API_KEY: ${INGEST_API_KEY}

      MONGO_URI: mongodb://mongo:27017/safeops_logs

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: safeops
      DB_PASSWORD: safeops
      DB_NAME: safeops_security

      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      JENKINS_BASE_URL: ${JENKINS_BASE_URL}
      JENKINS_USER: ${JENKINS_USER}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN}

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped

  # =========================
  # Log Parser
  # =========================
  log-parser:
    build:
      context: ./services/log-parser
    container_name: log-parser
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops_security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped
  # =========================
  # Vulnerability Detector
  # =========================
  vuln-detector:
    build:
      context: ./services/vuln-detector
    container_name: vuln-detector
    ports:
      - "3003:3003"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops_security
      RULES_FILE: /app/rules.yaml
    volumes:
      - ./services/vuln-detector/rules.yaml:/app/rules.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped

  # =========================
  # Fix Suggester
  # =========================
  fix-suggester:
    build:
      context: ./services/fix-suggester
    container_name: fix-suggester
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops_security
      FIX_RULES_FILE: /app/rules_fixes.yaml
    volumes:
      - ./services/fix-suggester/rules_fixes.yaml:/app/rules_fixes.yaml:ro
    command: uvicorn main:app --host 0.0.0.0 --port 3004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped


  # =========================
  # Machine Learning Service
  # =========================
  ml-service:
    build:
      context: ./services/ml-service
    container_name: ml-service
    ports:
      - "3007:3007"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: safeops_security
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      MODEL_DIR: /app/models
      MODEL_VERSION: v1
    volumes:
      - ./services/ml-service/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped

  # =========================
  # Anomaly Detector
  # =========================
  anomaly-detector:
    build:
      context: ./services/anomaly-detector
    container_name: anomaly-detector
    env_file:
      - ./services/anomaly-detector/.env
    ports:
      - "3005:3005"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops_security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped

  # =========================
  # Report Generator
  # =========================
  report-generator:
    build:
      context: ./services/report-generator
    container_name: report-generator
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: safeops
      POSTGRES_PASSWORD: safeops
      POSTGRES_DB: safeops_security
      REPORTS_DIR: /app/reports
      TEMPLATE_PATH: /app/templates/report.hbs
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./services/report-generator/reports:/app/reports
      - ./services/report-generator/templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safeops
    restart: unless-stopped

  # =========================
  # Dashboard API
  # =========================
  dashboard-api:
    build:
      context: ./services/dashboard-api
    container_name: dashboard-api
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safeops_security
      DB_USER: safeops
      DB_PASSWORD: safeops
      CORS_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      REPORT_BASE: "http://report-generator:3006"
      REPORT_BASE_PUBLIC: "http://127.0.0.1:3006"

    depends_on:
      postgres:
        condition: service_healthy
      report-generator:
        condition: service_started
    networks:
      - safeops
    restart: unless-stopped

  # =========================
  # Dashboard Web
  # =========================
  dashboard-web:
    build:
      context: ./dashboard-web
      args:
        VITE_API_BASE: "http://127.0.0.1:3010"
        VITE_REPORT_BASE: "http://127.0.0.1:3006"
    container_name: dashboard-web
    ports:
      - "5174:80"
    depends_on:
      dashboard-api:
        condition: service_started
      report-generator:
        condition: service_started
    networks:
      - safeops
    restart: unless-stopped

# =========================
# Networks & Volumes
# =========================
networks:
  safeops:

volumes:
  pgdata:
  mongodata:
