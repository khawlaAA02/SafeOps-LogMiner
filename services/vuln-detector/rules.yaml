rules:
  - id: SECRET-LEAK
    title: "Secrets exposed in CI logs"
    description: "Detects tokens/keys accidentally printed in logs."
    severity: "critical"
    mapping:
      owasp: "A02:2021 - Cryptographic Failures"
      slsa: "SLSA-3 - Prevent secret exposure"
    match:
      event_type: "secret"
    recommendation: "Rotate leaked secrets immediately, store secrets in vault, and redact logs."

  - id: SLSA-BYPASS
    title: "Security checks bypass detected"
    description: "Detects bypass flags or disabling security checks in pipeline."
    severity: "high"
    mapping:
      owasp: "A05:2021 - Security Misconfiguration"
      slsa: "SLSA-2 - Enforce policy checks"
    match:
      event_type: "bypass"
    recommendation: "Block bypass flags, enforce branch protection, and require mandatory security checks."

  - id: PIPELINE-FAIL
    title: "Pipeline failure indicators"
    description: "Generic errors that may indicate unstable pipeline or misconfiguration."
    severity: "medium"
    mapping:
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      slsa: "SLSA-1 - Improve build reliability"
    match:
      event_type: "error"
    recommendation: "Fix build/test failures and add monitoring + alerting for recurring errors."

  - id: EXTERNAL-URL
    title: "External URL found in logs"
    description: "External URLs can indicate downloads or outbound communications."
    severity: "low"
    mapping:
      owasp: "A10:2021 - SSRF"
      slsa: "SLSA-1 - Review external dependencies"
    match:
      event_type: "url"
    recommendation: "Review external endpoints, whitelist trusted domains, and pin dependencies."
