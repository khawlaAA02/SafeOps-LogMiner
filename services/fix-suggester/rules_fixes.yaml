rules:
  - rule_id: "SECRET-LEAK"
    title: "Secrets exposed in CI logs"
    severity: "critical"
    suggestion:
      safe: true
      template: |
        # FIX: Mask secrets and avoid printing them.
        - name: Mask secrets
          run: |
            echo "::add-mask::${{ secrets.MY_TOKEN }}"
        - name: Use GitHub Secrets / Vault
          run: |
            echo "Use secrets manager (Vault/GitHub Secrets) instead of hardcoding."

  - rule_id: "SLSA-BYPASS"
    title: "Security checks bypass detected"
    severity: "high"
    suggestion:
      safe: true
      template: |
        # FIX: Prevent bypass of checks
        - name: Enforce required checks
          run: |
            echo "Enable branch protection rules and required status checks."
            echo "Block '--no-verify' usage in your workflow steps."

  - rule_id: "PIPELINE-FAIL"
    title: "Pipeline failure indicators"
    severity: "medium"
    suggestion:
      safe: true
      template: |
        # FIX: Fail fast and improve logs
        - name: Fail fast
          run: |
            set -e
            echo "Stop pipeline if an error occurs"
        - name: Improve error context
          run: |
            echo "Add more logs + artifacts upload for debugging."

  - rule_id: "EXTERNAL-URL"
    title: "External URL found in logs"
    severity: "low"
    suggestion:
      safe: true
      template: |
        # FIX: Review external URLs / downloads
        - name: Validate external downloads
          run: |
            echo "Whitelist trusted domains and pin versions for external downloads."
name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "token=${{ secrets.MY_TOKEN }}"
          curl https://example.com/script.sh | bash
          git commit --no-verify -m "test"
          exit 1
